<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estude Sem Fronteiras</title>
  <style>
    :root{--navy:#003b68;--navy-2:#004875;--text:#222;--muted:#777;--line:#eee;--info:#d9f0ff;--info-border:#b9dff3}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#fff}
    .topbar{height:69px;background:var(--navy);display:flex;align-items:center;padding:0 24px;box-shadow:0 2px 8px #0004;color:white}
    .brand{display:flex;align-items:center;gap:8px;min-width:128px}
    .brand-mark{width:50px;height:50px;border-radius:7px;background:#075791;display:grid;place-items:center;position:relative;overflow:hidden}
    .brand-mark:before{content:"";width:31px;height:16px;background:#fff;clip-path:polygon(0 0,100% 0,75% 65%,50% 100%,25% 65%);display:block}
    .brand-mark:after{content:"";position:absolute;bottom:8px;width:23px;height:3px;border-radius:50%;background:#b9d8e8}
    .brand-name{font-size:13px;line-height:12px;font-weight:bold;letter-spacing:.1px}
    .brand-name span{display:block}
    .director{font-size:16px;font-weight:700;margin-left:10px;white-space:nowrap}
    .menu-toggle{margin-left:auto;width:55px;height:42px;border:1px solid #9db8b1;border-radius:5px;background:#446b67;color:white;font-size:27px;line-height:1;cursor:pointer}
    .hero{height:157px;background:#fafafa;padding:21px 24px}
    .hero-title{font-size:20px;color:#4e7f9d;margin:0}
    .menu-button{margin-top:53px;background:var(--navy);color:#fff;border:0;border-radius:3px;padding:10px 13px;font-size:14px;cursor:pointer}
    .menu-button .icon{font-size:15px;margin-right:8px}
    main{padding:27px 24px 0}
    .breadcrumb{background:#fafafa;padding:13px 17px;color:#4f84a0;font-size:14px;line-height:24px;margin-bottom:24px}
    .breadcrumb .slash{color:#ccc;margin:0 10px}
    .breadcrumb .current{color:#777}
    h1{font-size:22px;font-weight:600;margin:0;padding-bottom:25px;border-bottom:1px solid var(--line)}
    .notice{margin-top:25px;background:var(--info);border:1px solid var(--info-border);border-radius:4px;padding:19px;color:#39718e;font-size:16px;display:flex;align-items:center;gap:12px}
    .notice-icon{width:18px;height:18px;border-radius:50%;background:#39718e;color:#fff;display:inline-grid;place-items:center;font-size:12px;font-weight:bold;flex:0 0 auto}
    footer{margin:26px 24px 0;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:#aaa}
    @media (min-width:700px){.topbar{padding:0 40px}.hero,main{padding-left:40px;padding-right:40px}footer{margin-left:40px;margin-right:40px}.brand-name{font-size:14px}.director{font-size:18px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="Estude Sem Fronteiras">
      <div class="brand-mark" aria-hidden="true"></div>
      <div class="brand-name"><span>EstudeSem</span><span>Fronteiras</span><small>.com</small></div>
    </div>
    <div class="director">Conheça Nosso Diretor</div>
    <button class="menu-toggle" aria-label="Abrir menu" aria-expanded="false">☰</button>
  </header>

  <section class="hero">
    <p class="hero-title">Saiba como ganhar créditos!</p>
    <button class="menu-button"><span class="icon">▦</span> MENU</button>
  </section>

  <main>
    <nav class="breadcrumb" aria-label="Você está aqui">
      <span>Início</span><span class="slash">/</span><span class="current">Histórico de compras</span>
    </nav>
    <h1>Histórico de compras</h1>
    <div class="notice"><span class="notice-icon">i</span><span>Você ainda não efetuou nenhuma compra.</span></div>
  </main>

  <footer>Copyright © 2026 Estude Sem Fronteiras</footer>
  <script>
    document.querySelector('.menu-toggle').addEventListener('click', function(){
      const aberto=this.getAttribute('aria-expanded')==='true';
      this.setAttribute('aria-expanded',String(!aberto));
      this.textContent=aberto?'☰':'×';
    });
    document.querySelector('.menu-button').addEventListener('click', function(){
      alert('Menu');
    });
  </script>
</body>
</html>
