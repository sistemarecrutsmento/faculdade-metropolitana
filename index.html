<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faculdade Metropolitana</title>
  <style>
    :root{--navy:#003b68;--text:#222;--line:#eee;--info:#d9f0ff;--info-border:#b9dff3}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#fff}
    .topbar{height:69px;background:var(--navy);display:flex;align-items:center;padding:0 24px;box-shadow:0 2px 8px #0004;color:white;position:relative;z-index:3}
    .brand{display:flex;align-items:center;gap:8px;min-width:128px}.brand-mark{width:50px;height:50px;border-radius:7px;object-fit:cover;display:block}
    .brand-name{font-size:13px;line-height:12px;font-weight:bold}.brand-name span{display:block}.director{font-size:16px;font-weight:700;margin-left:10px;white-space:nowrap}
    .menu-toggle{margin-left:auto;width:55px;height:42px;border:1px solid #9db8b1;border-radius:5px;background:#446b67;color:white;font-size:27px;line-height:1;cursor:pointer}
    .profile-panel{display:none;position:absolute;top:69px;left:0;right:0;height:317px;background:var(--navy);box-shadow:0 5px 10px #0005;color:white;padding:20px 24px 0;z-index:5}
    .profile-panel.open{display:block}.panel-link{display:flex;align-items:center;gap:16px;color:#fff;text-decoration:none;font-size:18px;margin:3px 0 25px}.panel-icon{width:24px;text-align:center;font-size:22px}.profile-user{position:absolute;left:24px;bottom:27px;font-size:17px}.avatar{position:absolute;right:18px;bottom:0;width:57px;height:57px;border-radius:50%;background:#eee;border:1px solid #ddd;overflow:hidden;cursor:pointer;display:grid;place-items:center}.avatar img{width:100%;height:100%;object-fit:cover;display:none}.avatar.has-photo img{display:block}.avatar-placeholder{font-size:38px;color:#c9c9c9;line-height:1}
    .hero{height:157px;background:#fafafa;padding:21px 24px}.hero-title{font-size:20px;color:#4e7f9d;margin:0}.menu-button{margin-top:53px;background:var(--navy);color:#fff;border:0;border-radius:3px;padding:10px 13px;font-size:14px;cursor:pointer}.menu-button .icon{font-size:15px;margin-right:8px}
    main{padding:27px 24px 0}.breadcrumb{background:#fafafa;padding:13px 17px;color:#4f84a0;font-size:14px;line-height:24px;margin-bottom:24px}.breadcrumb .slash{color:#ccc;margin:0 10px}.breadcrumb .current{color:#777}h1{font-size:22px;font-weight:600;margin:0;padding-bottom:25px;border-bottom:1px solid var(--line)}
    .notice{margin-top:25px;background:var(--info);border:1px solid var(--info-border);border-radius:4px;padding:19px;color:#39718e;font-size:16px;display:flex;align-items:center;gap:12px}.notice-icon{width:18px;height:18px;border-radius:50%;background:#39718e;color:#fff;display:inline-grid;place-items:center;font-size:12px;font-weight:bold;flex:0 0 auto}footer{margin:26px 24px 0;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:#aaa}
    @media (min-width:700px){.topbar{padding:0 40px}.hero,main{padding-left:40px;padding-right:40px}footer{margin-left:40px;margin-right:40px}.brand-name{font-size:14px}.director{font-size:18px}.profile-panel{padding-left:40px}.profile-user{left:40px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="Faculdade Metropolitana"><img class="brand-mark" src="logo-faculdade.jpg" alt="Logo Faculdade Metropolitana"><div class="brand-name"><span>Faculdade</span><span>Metropolitana</span><small>.com</small></div></div>
    <div class="director">Conheça Nosso Diretor</div>
    <button class="menu-toggle" aria-label="Abrir menu" aria-expanded="false">☰</button>
    <div class="profile-panel" id="profilePanel">
      <a class="panel-link" href="#amigo"><span class="panel-icon">♧</span><span>Indique um amigo!</span></a>
      <label class="panel-link" for="photoInput" title="Adicionar foto"><span class="panel-icon">▣</span><span class="sr-only">Adicionar foto</span></label>
      <a class="panel-link" href="mailto:"><span class="panel-icon">✉</span><span class="sr-only">Mensagens</span></a>
      <div class="profile-user">Fabio Júnior (RA: 328879)</div>
      <label class="avatar" for="photoInput" title="Adicionar foto"><span class="avatar-placeholder">●</span><img id="avatarImage" alt="Foto do perfil"></label>
      <input id="photoInput" type="file" accept="image/*" hidden>
    </div>
  </header>
  <section class="hero"><p class="hero-title">Saiba como ganhar créditos!</p><button class="menu-button"><span class="icon">▦</span> MENU</button></section>
  <main><nav class="breadcrumb" aria-label="Você está aqui"><span>Início</span><span class="slash">/</span><span class="current">Histórico de compras</span></nav><h1>Histórico de compras</h1><div class="notice"><span class="notice-icon">i</span><span>Você ainda não efetuou nenhuma compra.</span></div></main>
  <footer>Copyright © 2026 Faculdade Metropolitana</footer>
  <script>
    const toggle=document.querySelector('.menu-toggle'),panel=document.querySelector('#profilePanel');
    toggle.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')==='true';toggle.setAttribute('aria-expanded',String(!open));toggle.textContent=open?'☰':'☰';panel.classList.toggle('open',!open)});
    document.querySelector('#photoInput').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{document.querySelector('#avatarImage').src=ev.target.result;document.querySelector('.avatar').classList.add('has-photo');};reader.readAsDataURL(file)});
    document.querySelector('.menu-button').addEventListener('click',()=>alert('Menu'));
  </script>
</body>
</html>
